<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Server Stats</title>
    <style>
        body {
            min-height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            background:
                    radial-gradient(ellipse at 50% 0%, #141b2d 0%, transparent 65%),
                    #0f1117;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            color: #e2e8f0;
        }

        .container {
            text-align: center;
            padding-top: 150px;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: .75rem;
            margin-bottom: 2.5rem;
        }

        .header img {
            width: 20px;
            height: 20px;
        }

        h1 {
            font-size: 1rem;
            font-weight: 500;
            color: #64748b;
        }

        .cards {
            display: flex;
            gap: 1.5rem;
        }

        .card {
            background: #1e2330;
            border: 1px solid #2d3448;
            border-radius: 12px;
            padding: 2rem 2.5rem;
            min-width: 160px;
            transition: border-color 0.2s;
        }

        .card .value {
            font-size: 3rem;
            font-weight: 700;
            line-height: 1;
            letter-spacing: -0.02em;
        }

        .card:nth-child(1) .value { color: #60a5fa; }
        .card:nth-child(2) .value { color: #34d399; }

        .card .label {
            margin-top: 0.6rem;
            font-size: 0.8rem;
            font-weight: 500;
            text-transform: uppercase;
            color: #64748b;
        }

        .link {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            margin-top: 2.5rem;
            font-size: 0.8rem;
            font-weight: 500;
            color: #475569;
            text-decoration: none;
            transition: color 0.2s;
        }

        .link:hover { color: #94a3b8; }

        .link svg {
            width: 13px;
            height: 13px;
            flex-shrink: 0;
        }

        .status {
            margin-top: 1rem;
            font-size: 0.75rem;
            color: #374151;
        }

        @media screen and (max-width: 500px) {
            .cards {
                flex-direction: column;
                gap: 1rem;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <img src="https://demo.pelagica.app/logo.svg" alt="Pelagica logo"/>
        <h1>Pelagica Stats</h1>
    </div>
    <div class="cards">
        <div class="card">
            <div class="value" id="total">—</div>
            <div class="label">Total Installs</div>
        </div>
        <div class="card">
            <div class="value" id="active">—</div>
            <div class="label">Active Instances</div>
        </div>
    </div>
    <a href="https://github.com/PelagicaApp/collector" target="_blank" class="link">
        <svg viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 0C5.37 0 0 5.37 0 12c0 5.3 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61-.546-1.385-1.335-1.755-1.335-1.755-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 21.795 24 17.295 24 12c0-6.63-5.37-12-12-12z"/>
        </svg>
        Collector Source Code
    </a>
    <div class="status">
        <span id="status-text"></span>
    </div>
</div>

<script>
    const totalEl  = document.getElementById("total");
    const activeEl = document.getElementById("active");
    const statusEl = document.getElementById("status-text");

    async function fetchStats() {
        try {
            const res  = await fetch("/stats");
            const data = await res.json();
            totalEl.textContent  = data.total_installs;
            activeEl.textContent = data.active_instances;
        } catch {
            statusEl.textContent = "Failed to fetch stats";
        }
    }

    fetchStats();
</script>
</body>
</html>
